name: Robô de Ofertas

on:
  # Roda de hora em hora, das 8h às 23h (horário de Brasília). O GitHub usa UTC.
  schedule:
    - cron: '7 0-2,11-23 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'O que fazer'
        type: choice
        default: postar
        options:
          - postar
          - testar
          - parear
          - listar-grupos

concurrency:
  group: robo-ofertas
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - run: npm install --no-audit --no-fund

      # Recupera sessão do WhatsApp e lista de ofertas já postadas
      - uses: actions/cache/restore@v4
        with:
          path: dados
          key: dados-${{ github.run_id }}
          restore-keys: dados-

      - name: Rodar robô
        run: node src/index.js "${{ inputs.modo || 'postar' }}"
        env:
          WHATS_NUMERO: ${{ secrets.WHATS_NUMERO }}
          GRUPO_ID: ${{ secrets.GRUPO_ID }}
          AFILIADO_PARAMS: ${{ secrets.AFILIADO_PARAMS }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: dados
          key: dados-${{ github.run_id }}-${{ github.run_attempt }}
